name: Native macOS app

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel an in-progress run when a *PR branch* is pushed again — but never a
# push to main, or that commit keeps a permanently "cancelled" status.
concurrency:
  group: native-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: CFBundleVersion is the commit count (build-app.sh).
          fetch-depth: 0
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test synthetic runner fixtures
        run: swift test
      - name: Check sandboxed widget home lookup
        run: scripts/check-widget-home.sh
      - name: Build universal app
        run: scripts/build-app.sh --universal --zip
      - name: Check bundled license
        # build-app.sh copies LICENSE into the app; the uploaded zip must carry it.
        run: |
          test -s dist/RunningMan.app/Contents/Resources/LICENSE
          cmp LICENSE dist/RunningMan.app/Contents/Resources/LICENSE
          unzip -p dist/RunningMan-macos-universal.zip RunningMan.app/Contents/Resources/LICENSE | cmp - LICENSE
      - name: Check architectures
        run: |
          lipo "dist/RunningMan.app/Contents/MacOS/RunningMan" -verify_arch arm64 x86_64
          lipo "dist/RunningMan.app/Contents/PlugIns/RunningManWidgets.appex/Contents/MacOS/RunningManWidgets" -verify_arch arm64 x86_64
      - name: Check widget registration
        run: |
          widget="$PWD/dist/RunningMan.app/Contents/PlugIns/RunningManWidgets.appex"
          pluginkit -a "$widget"
          registration="$(pluginkit -m -A -D -v -i ch.lkmc.RunningMan.Widgets)"
          case "$registration" in
            *"ch.lkmc.RunningMan.Widgets"*) printf '%s\n' "$registration" ;;
            *) echo "Widget extension was not registered." >&2; exit 1 ;;
          esac
      - name: Render isolated preview
        # Blocking, because the release workflow runs the same step. The script
        # fails after two minutes if the capture stalls; this is a backstop.
        timeout-minutes: 4
        run: scripts/smoke-test.sh
      - name: Upload app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RunningMan-macOS
          path: |
            dist/RunningMan-macos-universal.zip
            dist/RunningMan-macos-universal.zip.sha256
          retention-days: 7
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RunningMan-preview
          path: .local/screenshots/
          if-no-files-found: ignore
          retention-days: 7
